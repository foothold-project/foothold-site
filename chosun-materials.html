<script>
(function(){
  var W=7*86400000,KEY='fh_seen';
  function norm(s){s=(s||'').split('/').pop().split('#')[0].split('?')[0]
    .replace(/\.html$/,'');return s||'index'}
  function apply(){
    var seen={},raw={};
    try{raw=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
    for(var k in raw)seen[norm(k)]=raw[k];
    seen[norm(location.pathname)]=Date.now();
    try{localStorage.setItem(KEY,JSON.stringify(seen))}catch(e){}
    document.querySelectorAll('a[data-added]').forEach(function(a){
      var t=Date.parse(a.getAttribute('data-added')+'T00:00:00');
      var tgt=norm(a.getAttribute('href'));
      a.classList.toggle('is-new',
        !isNaN(t)&&Date.now()-t>=0&&Date.now()-t<=W&&!seen[tgt]);
    });
  }
  document.addEventListener('DOMContentLoaded',apply);
  window.addEventListener('pageshow',function(e){if(e.persisted)apply()});
})();
</script>

<script>
document.addEventListener('DOMContentLoaded',function(){
  /* «← …로» 버튼은 라벨이 가리키는 곳으로만 간다.
     예전의 «스마트 뒤로가기»(history.back)는 제거했다. 라벨은 «표지로»인데
     실제로는 직전 페이지로 돌아가 사용자를 속였다. (2026-08-24) */
  /* 검색 버튼: PDF 저장 버튼 왼쪽, 같은 스타일 (레이아웃을 새로 만들지 않는다) */
  var pb=document.getElementById('pdfBtn')||document.querySelector('.pdfbtn');
  var sb=document.createElement('button');sb.type='button';
  sb.className=((pb?pb.className:'fh-sbtn-fix')+' fh-sbtn').replace(/ pdf /,' ').trim();
  sb.setAttribute('aria-label','사이트 검색');
  sb.innerHTML='<svg viewBox="0 0 16 16" width="11" height="11" fill="none" '
    +'stroke="currentColor" stroke-width="1.6" aria-hidden="true">'
    +'<circle cx="7" cy="7" r="4.2"/><path d="M10.4 10.4L14 14"/></svg>검색';
  if(pb)pb.parentNode.insertBefore(sb,pb);else document.body.appendChild(sb);
  function offset(){ /* PDF 버튼이 화면 고정형이면 그 왼쪽에 나란히 고정 */
    if(!pb)return;var cs=getComputedStyle(pb);
    var r=pb.getBoundingClientRect();
    if(cs.display==='none'||r.width===0){ /* PDF 가 숨겨진 화면(백과 모바일): 검색이 그 자리에 */
      sb.style.position='fixed';sb.style.top='7px';sb.style.right='14px';sb.style.zIndex='70';
    }else if(cs.position==='fixed'){
      sb.style.position='fixed';sb.style.top=r.top+'px';
      sb.style.right=(window.innerWidth-r.left+8)+'px';sb.style.zIndex=cs.zIndex;
    }else{sb.style.position='';sb.style.top='';sb.style.right='';}}
  offset();window.addEventListener('resize',offset);
  /* 오버레이 */
  var ov=document.createElement('div');ov.className='fh-so';
  ov.innerHTML='<div class="fh-sp"><input type="search" placeholder="검색 (제목 · 절 · 본문)" '
    +'aria-label="사이트 검색"><div class="fh-sr"></div></div>';
  document.body.appendChild(ov);
  var inp=ov.querySelector('input'),res=ov.querySelector('.fh-sr'),IDX=null,sel=-1;
  function open(){ov.classList.add('on');inp.focus();inp.select();}
  function close(){ov.classList.remove('on');}
  sb.addEventListener('click',open);
  ov.addEventListener('mousedown',function(e){if(e.target===ov)close();});
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();open();}
    else if(e.key==='Escape'&&ov.classList.contains('on'))close();
  });
  function load(cb){if(IDX)return cb();
    fetch('assets/search-index.json').then(function(r){return r.json()})
      .then(function(j){IDX=j;cb()}).catch(function(){IDX=[];cb()});}
  function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function go(){
    var q=inp.value.trim().toLowerCase();sel=-1;
    if(q.length<2){res.innerHTML='';return;}
    load(function(){
      var hits=[];
      for(var i=0;i<IDX.length&&hits.length<40;i++){
        var e=IDX[i],hi=e.h.toLowerCase().indexOf(q),ti=e.x.toLowerCase().indexOf(q),
            pi=e.t.toLowerCase().indexOf(q);
        if(hi<0&&ti<0&&pi<0)continue;
        var score=(hi>=0?3:0)+(pi>=0?2:0)+(ti>=0?1:0);
        var snip='';
        if(ti>=0){var s=Math.max(0,ti-34);snip=(s>0?'…':'')+e.x.substr(s,95)+'…';}
        hits.push({e:e,s:score,snip:snip});
      }
      hits.sort(function(a,b){return b.s-a.s});
      hits=hits.slice(0,12);
      if(!hits.length){res.innerHTML='<div class="none">결과 없음: '+esc(q)+'</div>';}
      else{res.innerHTML=hits.map(function(h){
        return '<a href="'+h.e.p+(h.e.a?'#'+h.e.a:'')+'"><div class="sp1">'+esc(h.e.t)
          +'</div><div class="sp2">'+esc(h.e.h)+'</div>'
          +(h.snip?'<div class="sp3">'+esc(h.snip)+'</div>':'')+'</a>';}).join('');}
    });
  }
  inp.addEventListener('input',go);
  inp.addEventListener('keydown',function(e){
    e.stopPropagation(); /* 커리큘럼 등 자체 키보드 내비게이션 페이지로 새지 않게 */
    if(e.key==='Escape'){close();return;}
    var as=res.querySelectorAll('a');if(!as.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,as.length-1);}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);}
    else if(e.key==='Enter'&&sel>=0){e.preventDefault();as[sel].click();return;}
    else return;
    as.forEach(function(a,i){a.classList.toggle('sel',i===sel)});
    if(as[sel])as[sel].scrollIntoView({block:'nearest'});
  });
});
</script>

<!--gnav:v1--><div class="gnav"><div class="in"><a class="home" href="index.html">FOOTHOLD</a><a class="" href="hub-proposal.html">기획</a><a class="" href="hub-schedule.html">일정</a><a class="" href="hub-meeting.html">회의</a><a class="" href="hub-research.html">연구</a><a class="" href="hub-pipeline.html">파이프라인</a><span class="sp"></span><a class="q on" href="chosun-materials.html">팀 자료실</a><a class="q" href="encyclopedia.html">도메인 백과</a><a class="q" href="curriculum.html">학습 커리큘럼</a><a class="q" href="budget.html">예산안</a></div></div><!--/gnav:v1-->

<div class="wrap">
<h1>팀 자료실 · 조선대 제공 수업 자료</h1>
<p class="note">이 자료는 조선대학교 측 저작물입니다. <b>팀 내부 열람용</b>으로만 제공하며 비밀번호로 보호됩니다 (비밀번호는 디스코드 리소스 채널). 외부 공유 금지.</p>

<div class="gate" id="gate">
  <b>비밀번호</b>
  <input type="password" id="pw" placeholder="팀 비밀번호" autocomplete="off">
  <div class="err" id="err"></div>
  <button id="go">열기</button>
</div>

<div id="list"></div>
<div id="extra"></div>

</div>
<script>
let MAN=null, KEY=null;
async function loadMan(){
  if(!MAN) MAN = await (await fetch('assets/secure/manifest.json?t='+Date.now(), {cache:'no-store'})).json();
  return MAN;
}
async function deriveKey(pw, saltHex, iters){
  const salt = Uint8Array.from(saltHex.match(/../g).map(h=>parseInt(h,16)));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
    'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iters, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function decryptFile(url){
  const buf = new Uint8Array(await (await fetch(url+'?v='+MAN.salt.slice(0,8), {cache:'no-store'})).arrayBuffer());
  const nonce = buf.slice(0,12), ct = buf.slice(12);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:nonce}, KEY, ct));
}
document.getElementById('go').addEventListener('click', async ()=>{
  const err = document.getElementById('err'); err.textContent='';
  try{
    const man = await loadMan();
    KEY = await deriveKey(document.getElementById('pw').value, man.salt, man.iters);
    const cb = Uint8Array.from(man.check.match(/../g).map(h=>parseInt(h,16)));
    await crypto.subtle.decrypt({name:'AES-GCM', iv:cb.slice(0,12)}, KEY, cb.slice(12));
  }catch(e){ err.textContent='비밀번호가 맞지 않습니다.'; KEY=null; return; }
  document.getElementById('gate').style.display='none';
  const list = document.getElementById('list'); list.style.display='block';
  const KIND='chosun';
  // 암호 뒤에 둔 안내(저장소 주소 · 담당자). 해제해야만 보인다.
  if(MAN.notes && MAN.notes[KIND]){
    try{
      const nb = await decryptFile(MAN.notes[KIND]);
      document.getElementById('extra').innerHTML = new TextDecoder().decode(nb);
    }catch(e){ console.error('note', e); }
  }
  for(const it of MAN.items.filter(x=>(x.kind||'chosun')===KIND)){
    const d = document.createElement('div'); d.className='item';
    d.innerHTML = '<span class="no">'+it.no+'</span><b>'+it.title+'</b>'
      +'<div class="m">'+it.name+' · '+(it.size/1048576).toFixed(1)+' MB · 등록 '+it.added+'</div>';
    const dl = document.createElement('button'); dl.textContent='다운로드 (원본)';
    dl.onclick = async ()=>{
      const data = await decryptFile(it.file);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data]));
      a.download = it.name; a.click();
    };
    d.appendChild(dl);
    if(it.view){
      const v = document.createElement('button'); v.textContent='여기서 보기';
      v.onclick = async ()=>{
        let box = d.querySelector('.pdfbox');
        if(box){ box.remove(); d.querySelector('.close').remove(); return; }
        v.disabled = true; v.textContent = '여는 중...';
        try{
          const data = await decryptFile(it.view);
          const pdfjs = await import('/assets/vendor/pdfjs/pdf.min.mjs');
          pdfjs.GlobalWorkerOptions.workerSrc = '/assets/vendor/pdfjs/pdf.worker.min.mjs';
          const doc = await pdfjs.getDocument({data}).promise;
          box = document.createElement('div'); box.className='pdfbox';
          const cl = document.createElement('button'); cl.className='close';
          cl.textContent='닫기'; cl.style.display='block'; cl.style.margin='8px 0';
          cl.onclick = ()=>{ box.remove(); cl.remove(); };
          d.appendChild(box); d.appendChild(cl);
          const wpx = Math.min(d.clientWidth - 4, 920);
          for(let n=1; n<=doc.numPages; n++){
            const pg = await doc.getPage(n);
            const base = pg.getViewport({scale:1});
            const scale = wpx / base.width * (window.devicePixelRatio||1);
            const vp = pg.getViewport({scale});
            const cv = document.createElement('canvas');
            cv.width = vp.width; cv.height = vp.height;
            cv.style.width = '100%'; cv.style.display='block';
            cv.style.border = '1px solid var(--rule,#d8d4c8)'; cv.style.marginBottom='6px';
            box.appendChild(cv);
            await pg.render({canvasContext:cv.getContext('2d'), viewport:vp}).promise;
          }
        }catch(e){ const er=document.createElement('div'); er.style.cssText='color:#b3452c;font-size:.8rem;margin-top:6px'; er.textContent='열기 실패: '+e.message; d.appendChild(er); console.error('viewer', e); }
        v.disabled = false; v.textContent = '여기서 보기';
      };
      d.appendChild(v);
      const nt = document.createElement('button'); nt.textContent='새 탭에서 보기';
      nt.onclick = async ()=>{
        const data = await decryptFile(it.view);
        window.open(URL.createObjectURL(new Blob([data],{type:'application/pdf'})), '_blank');
      };
      d.appendChild(nt);
    }
    list.appendChild(d);
  }
});
document.getElementById('pw').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('go').click();
});
</script>
