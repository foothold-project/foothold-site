<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOOTHOLD · 평가 영상 갤러리</title>
<meta name="description" content="정책 판별 평가 영상과 성적. 판이 늘 때마다 한 벌씩 쌓인다">
<link rel="stylesheet" href="/gallery/gallery.css">
</head>
<body>
<div class="wrap">

<header>
  <div class="crumb"><a href="/">FOOTHOLD</a> · 갤러리</div>
  <div class="eyebrow">Evaluation Gallery</div>
  <h1>평가 영상 갤러리</h1>
  <p class="lede">정책을 새로 내놓을 때마다 <b>종합보고서 N차</b>와 <b>gallery-vN</b> 이
     한 벌로 쌓인다. 각 판은 그 판의 주인공 모델과 기준선 NVIDIA · A 를 같은 조건에서
     찍은 영상, 그리고 그 영상이 근거로 삼은 평가 성적을 함께 담는다.</p>
</header>

<div id="body"></div>

<footer>
  <div>영상은 평가와 같은 정책·같은 지형 설정으로 찍은 <b>시연 1회</b>다. 옆에 적힌 성공률은 그 자리의 100판 평가 결과이고, 영상 한 판의 성패가 아니다.</div>
  <div>색인 <span class="mono">versions.json</span> · <span class="mono">vN/manifest.json</span></div>
</footer>

</div>
<script src="/gallery/gallery.js"></script>
<script>
(async function () {
  const body = document.getElementById('body');

  let index;
  try {
    index = G.checkSchema(await G.loadJSON(G.at('versions.json')), 'foothold-gallery-index/');
  } catch (err) {
    body.appendChild(G.warn('판 목록을 읽지 못했습니다. ' + err.message, true));
    return;
  }

  const list = G.el('div', { class: 'versions' });

  index.versions.forEach(v => {
    const latest = v.version === index.latest;
    const card = G.el('div', { class: 'vcard' + (latest ? ' latest' : '') });

    const head = G.el('div', { class: 'vhead' }, [
      G.el('span', { class: 'v', text: 'gallery-' + v.version }),
      latest ? G.el('span', { class: 'tag main', text: '최신' }) : null,
      G.el('span', { class: 'tag compare', text: '주 모델 ' + v.main_model })
    ]);
    card.appendChild(head);

    if (v.headline) {
      card.appendChild(G.el('div', { text: v.headline }));
    }

    const stats = G.el('div', { class: 'vstats' }, [
      G.el('span', {}, [G.el('b', { text: String(v.clips) }), G.el('span', { text: ' 컷' })]),
      G.el('span', {}, [G.el('b', { text: String(v.evaluations) }), G.el('span', { text: ' 평가 칸' })]),
      G.el('span', {}, [G.el('b', { text: String(v.terrains) }), G.el('span', { text: ' 지형' })]),
      G.el('span', { text: '난이도 ' + v.difficulty }),
      G.el('span', { text: '평가 ' + (v.evaluated_at ? v.evaluated_at.slice(0, 10) : '미기록') })
    ]);
    card.appendChild(stats);

    const hashes = Object.entries(v.models || {})
      .map(([name, sha]) => name + ' ' + (sha ? sha.slice(0, 12) : '해시 없음'));
    if (hashes.length) {
      card.appendChild(G.el('div', {
        class: 'mono', style: 'font-size:.72rem;color:var(--ink-3)',
        text: hashes.join('  ·  ')
      }));
    }

    const links = G.el('div', { class: 'vlinks' }, [
      G.el('a', { class: 'btn go', href: G.at('view/') + '?v=' + encodeURIComponent(v.version),
                  text: '영상 ' + v.clips + '컷 보기' }),
      G.el('a', { class: 'btn', href: G.at('compare/') + '?left=' + encodeURIComponent(v.version) + ':baseline' +
                  '&mid=' + encodeURIComponent(v.version) + ':' + encodeURIComponent(v.main_model),
                  text: '판 비교' }),
      v.report ? G.el('a', { class: 'btn', href: v.report, text: '종합보고서' }) : null
    ]);
    card.appendChild(links);

    list.appendChild(card);
  });

  body.appendChild(list);
})();
</script>
</body>
</html>
